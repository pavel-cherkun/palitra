<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#efece6">
<title>Палитра</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="score"><b>0</b><span>доставлено</span></div>
  <div id="week"><span>Неделя 1</span><div class="bar"><i></i></div><button id="pause" aria-label="Пауза"><i></i><i></i></button></div>
</div>
<div id="hint"></div>

<div id="panel">
  <div class="item" data-k="belt" title="Клетки ленты"><span class="ico belt"></span><b>0</b></div>
  <div class="item drag" data-k="mix" title="Смеситель: тащи на поле"><span class="ico mix"></span><b>0</b></div>
  <div class="item drag" data-k="split" title="Разделитель: тащи на поле"><span class="ico split"></span><b>0</b></div>
  <div class="item" data-k="bridge" title="Мосты: лента может пересечь другую"><span class="ico bridge"></span><b>0</b></div>
  <div class="sep"></div>
  <div class="item tool" id="erase" title="Ластик: проводи по лентам и узлам (на ПК — правая кнопка)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 21h10"/><path d="M5.5 14.5 14 6a2.1 2.1 0 0 1 3 0l2 2a2.1 2.1 0 0 1 0 3l-8.5 8.5H8.5l-3-3a2.1 2.1 0 0 1 0-3z"/><path d="m9 11 5 5"/></svg>
  </div>
</div>

<div id="ov"></div>

<script src="game.js"></script>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#efece6">
<title>Палитра</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="score"><b>0</b><span>доставлено</span></div>
  <div id="week"><span>Неделя 1</span><div class="bar"><i></i></div><button id="pause" aria-label="Пауза"><i></i><i></i></button></div>
</div>
<div id="hint"></div>

<div id="panel">
  <div class="item" data-k="belt" title="Клетки ленты"><span class="ico belt"></span><b>0</b></div>
  <div class="item drag" data-k="mix" title="Смеситель: тащи на поле"><span class="ico mix"></span><b>0</b></div>
  <div class="item drag" data-k="split" title="Разделитель: тащи на поле"><span class="ico split"></span><b>0</b></div>
  <div class="item" data-k="bridge" title="Мосты: лента может пересечь другую"><span class="ico bridge"></span><b>0</b></div>
</div>

<div id="ov"></div>

<script src="game.js"></script>
</body>
</html>
